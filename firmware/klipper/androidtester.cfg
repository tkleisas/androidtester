# AndroidTester Klipper config — BIGTREETECH SKR Pico v1.0 (RP2040 over USB).
#
# CoreXY gantry (stepper_x/stepper_y) + tool-Z elevator as a manual_stepper
# (auxiliary axis, not part of the CoreXY kinematics) + three hobby servos
# (two nest button plungers, one finger deploy/stow). Design docs:
# docs/01-mechanical.md, docs/02-electronics.md (pin map, power, E-stop).
#
# This file defines the macro contract the Python framework calls (see
# androidtester/harness.py); tests/test_macro_contract.py fails if the two
# drift apart. Straight-line moves only, no math.* in templates (Klipper's
# Jinja context lacks it). Calibrate rotation_distance/endstop polarity on
# the real machine.
#
# Flash the RP2040 with USB communication; get the serial path from
# `ls /dev/serial/by-id/` after the first boot.

[mcu]
serial: /dev/serial/by-id/usb-Klipper_rp2040_CHANGE_ME
restart_method: command

[printer]
kinematics: corexy
max_velocity: 200
max_accel: 1500
# No max_z_velocity/max_z_accel: the real tool-Z is [manual_stepper tool_z]
# below; the placeholder Z rail never moves.

# Klipper's corexy kinematics loads three rails (x/y/z) unconditionally, so a
# placeholder stepper_z must exist even though this rig has no G-code Z axis.
# It sits on otherwise-unused pins (E0 enable, filament-sensor port, probe
# port, THB input), is NEVER homed (HOME_ALL does G28 X Y only) and never
# moved — the tool elevator is driven exclusively via MANUAL_STEPPER so no
# G-code path can move Z. Nothing is attached to these pins.
[stepper_z]
step_pin: gpio16                    # FSC port (free)
dir_pin: gpio22                     # PROBE port (free)
enable_pin: !gpio15                 # E0 socket EN (socket empty)
microsteps: 16
rotation_distance: 8
endstop_pin: ^gpio26                # THB input, usable as digital-in
position_min: 0
position_max: 60
position_endstop: 0
homing_speed: 5

# -- motion: CoreXY A/B ---------------------------------------------------------
# rotation_distance 40 = GT2 belt (2.0 mm pitch) x 20-tooth pulley = 40.0 mm/rev.

[stepper_x]
step_pin: gpio11
dir_pin: gpio10
enable_pin: !gpio12
microsteps: 16
rotation_distance: 40               # 2.0 mm pitch x 20 T pulley
endstop_pin: ^gpio4                 # X-STOP port, microswitch to GND
position_endstop: 0
position_max: 400                   # == config.py deck_width_mm
homing_speed: 40

[tmc2209 stepper_x]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 0                     # MS jumper block: X socket = address 0
sense_resistor: 0.110
run_current: 0.8
stealthchop_threshold: 999999

[stepper_y]
step_pin: gpio6
dir_pin: gpio5
enable_pin: !gpio7
microsteps: 16
rotation_distance: 40               # 2.0 mm pitch x 20 T pulley
endstop_pin: ^gpio3                 # Y-STOP port, microswitch to GND
position_endstop: 0
position_max: 300                   # == config.py deck_height_mm
homing_speed: 40

[tmc2209 stepper_y]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 2                     # MS jumper block: Y socket = address 2
sense_resistor: 0.110
run_current: 0.8
stealthchop_threshold: 999999

# -- tool-Z elevator (finger height) --------------------------------------------
# NEMA17 + T8 lead screw: rotation_distance 8 = 2 mm pitch x 4 starts = 8 mm/rev.
# Homes UP against a microswitch at the top of travel (away from the deck) via
# MANUAL_STEPPER ... STOP_ON_ENDSTOP=home, then SET_POSITION fixes the frame.
# NOTE: no position_min/position_max here on purpose — the homing move targets
# past the switch and would be range-rejected. The macros only ever command
# 0..Z_TOP.

[manual_stepper tool_z]
step_pin: gpio19
dir_pin: gpio28
enable_pin: !gpio2
microsteps: 16
rotation_distance: 8                # T8x8 lead screw
velocity: 30
accel: 200
endstop_pin: ^gpio25                # Z-STOP port, switch at the TOP of travel

[tmc2209 manual_stepper tool_z]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 1                     # MS jumper block: Z socket = address 1
sense_resistor: 0.110
run_current: 0.6                    # lead screw only lifts the ~150 g tool
stealthchop_threshold: 999999

# -- servos ----------------------------------------------------------------------
# plunger_0/plunger_1 are the contract names devices/*.yaml map buttons to.
# finger_deploy swings the finger tool between stow and working positions.
# The E0 driver socket stays EMPTY: its STEP/DIR pins are repurposed as the
# two extra servo signals (RP2040 PWM works on any GPIO). Servo 5 V/GND comes
# from the servo buck, not the board — see docs/02-electronics.md.

[servo plunger_0]                   # e.g. power button
pin: gpio29                         # SERVO port
maximum_servo_angle: 180
minimum_pulse_width: 0.0005
maximum_pulse_width: 0.0025

[servo plunger_1]                   # e.g. volume buttons
pin: gpio14                         # E0 socket STEP pin (socket unused)
maximum_servo_angle: 180
minimum_pulse_width: 0.0005
maximum_pulse_width: 0.0025

[servo finger_deploy]               # finger tool stow/deploy
pin: gpio13                         # E0 socket DIR pin (socket unused)
maximum_servo_angle: 180
minimum_pulse_width: 0.0005
maximum_pulse_width: 0.0025

# -- machine constants (calibrate per rig) --------------------------------------
# travel_z/touch_z mirror config.py travel_z_mm/touch_z_mm (checked by
# tests/test_design_package.py).

[gcode_macro _AT_VARS]
description: AndroidTester machine constants
variable_travel_z: 40.0           # clearance plane: no XY travel below this
variable_touch_z: 5.0             # finger-tip contact height
variable_z_top: 60.0              # tool-Z travel limit (top endstop position)
variable_park_x: 10.0
variable_park_y: 10.0
variable_travel_speed: 150.0      # mm/s (XY)
variable_z_speed: 30.0            # mm/s (tool-Z)
variable_z_touch_speed: 10.0      # mm/s (tool-Z approach to the glass)
variable_plunger_rest_angle: 10
variable_plunger_press_angle: 80
variable_finger_deploy_angle: 90  # working position (finger vertical)
variable_finger_stow_angle: 0     # swung clear of the nest
gcode:                            # variables only; never called directly

# -- macro contract: called by androidtester/harness.py --------------------------
# Every FINGER_* macro returns tool-Z to travel_z; HOME_ALL re-zeros the frame,
# so the absolute MANUAL_STEPPER moves below never drift.

[gcode_macro HOME_ALL]
description: Home X, Y, and tool-Z
gcode:
    {% set v = printer["gcode_macro _AT_VARS"] %}
    G90
    G28 X Y
    # tool-Z: drive past the top switch, stop on trigger, then define position
    MANUAL_STEPPER STEPPER=tool_z SET_POSITION=0
    MANUAL_STEPPER STEPPER=tool_z MOVE={v.z_top + 5} STOP_ON_ENDSTOP=home SPEED={v.z_touch_speed}
    MANUAL_STEPPER STEPPER=tool_z SET_POSITION={v.z_top}
    MANUAL_STEPPER STEPPER=tool_z MOVE={v.travel_z} SPEED={v.z_speed}

[gcode_macro TOOLS_UP]
description: Lift the toolhead to the travel clearance plane
gcode:
    {% set v = printer["gcode_macro _AT_VARS"] %}
    G90
    MANUAL_STEPPER STEPPER=tool_z MOVE={v.travel_z} SPEED={v.z_speed}

[gcode_macro FINGER_TAP]
description: Tap at X, Y (deck mm); tools up first, down only for the touch
gcode:
    {% set v = printer["gcode_macro _AT_VARS"] %}
    {% set x = params.X|float %}
    {% set y = params.Y|float %}
    G90
    SET_SERVO SERVO=finger_deploy ANGLE={v.finger_deploy_angle}
    MANUAL_STEPPER STEPPER=tool_z MOVE={v.travel_z} SPEED={v.z_speed}
    G1 X{x} Y{y} F{v.travel_speed * 60}
    MANUAL_STEPPER STEPPER=tool_z MOVE={v.touch_z} SPEED={v.z_touch_speed}
    G4 P80
    MANUAL_STEPPER STEPPER=tool_z MOVE={v.travel_z} SPEED={v.z_speed}

[gcode_macro FINGER_SWIPE]
description: Swipe from (X1, Y1) to (X2, Y2) over T milliseconds
gcode:
    {% set v = printer["gcode_macro _AT_VARS"] %}
    {% set x1 = params.X1|float %}
    {% set y1 = params.Y1|float %}
    {% set x2 = params.X2|float %}
    {% set y2 = params.Y2|float %}
    {% set t_ms = [params.T|default(400)|int, 50]|max %}   # clamp: no div-by-zero
    # Feed from the dominant axis (straight-line only, no trig): diagonal
    # swipes run up to sqrt(2)x slower than requested — acceptable for UI.
    # Feed clamped to 300..9000 mm/min (5..150 mm/s).
    {% set dist = [(x2 - x1)|abs, (y2 - y1)|abs]|max %}
    {% set feed = [[60.0 * dist * 1000.0 / t_ms, 300]|max, 9000]|min|int %}
    G90
    SET_SERVO SERVO=finger_deploy ANGLE={v.finger_deploy_angle}
    MANUAL_STEPPER STEPPER=tool_z MOVE={v.travel_z} SPEED={v.z_speed}
    G1 X{x1} Y{y1} F{v.travel_speed * 60}
    MANUAL_STEPPER STEPPER=tool_z MOVE={v.touch_z} SPEED={v.z_touch_speed}
    G1 X{x2} Y{y2} F{feed}
    MANUAL_STEPPER STEPPER=tool_z MOVE={v.travel_z} SPEED={v.z_speed}

[gcode_macro FINGER_LONG_PRESS]
description: Press and hold at X, Y for T milliseconds
gcode:
    {% set v = printer["gcode_macro _AT_VARS"] %}
    {% set x = params.X|float %}
    {% set y = params.Y|float %}
    {% set t_ms = params.T|default(1000)|int %}
    G90
    SET_SERVO SERVO=finger_deploy ANGLE={v.finger_deploy_angle}
    MANUAL_STEPPER STEPPER=tool_z MOVE={v.travel_z} SPEED={v.z_speed}
    G1 X{x} Y{y} F{v.travel_speed * 60}
    MANUAL_STEPPER STEPPER=tool_z MOVE={v.touch_z} SPEED={v.z_touch_speed}
    G4 P{t_ms}
    MANUAL_STEPPER STEPPER=tool_z MOVE={v.travel_z} SPEED={v.z_speed}

[gcode_macro BUTTON_PRESS]
description: Pulse a servo plunger (PLUNGER=servo name) against a side button
gcode:
    {% set v = printer["gcode_macro _AT_VARS"] %}
    {% set plunger = params.PLUNGER|string %}
    SET_SERVO SERVO={plunger} ANGLE={v.plunger_press_angle}
    G4 P250
    SET_SERVO SERVO={plunger} ANGLE={v.plunger_rest_angle}

[gcode_macro PARK]
description: Tools up and off the device; safe end state of every run
gcode:
    {% set v = printer["gcode_macro _AT_VARS"] %}
    G90
    MANUAL_STEPPER STEPPER=tool_z MOVE={v.travel_z} SPEED={v.z_speed}
    SET_SERVO SERVO=finger_deploy ANGLE={v.finger_stow_angle}
    G1 X{v.park_x} Y{v.park_y} F{v.travel_speed * 60}

# -- emergency stop ---------------------------------------------------------------
# The hardware E-stop is a 2-pole NC mushroom cutting the 24 V feeds to the
# SKR Pico and the servo buck (docs/02-electronics.md) — motion dies even if
# the firmware hangs. Klipper's M112 remains as the software layer.
